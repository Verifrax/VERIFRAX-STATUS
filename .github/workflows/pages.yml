name: pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Run live perimeter monitor
        shell: bash
        run: npm run perimeter:status

      - name: Assert live perimeter status
        shell: bash
        run: npm run perimeter:assert

      - name: Generate public control receipt
        shell: bash
        run: npm run control:receipt

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp public/index.html dist/index.html
          cp public/404.html dist/404.html
          cp public/CNAME dist/CNAME
          cp -R surface-system dist/surface-system
          cp -R data dist/data
          cp -R system dist/system
          cp system-control.json dist/system-control.json
          cp status.json dist/status.json
          cp -R perimeter dist/perimeter
          cp -R control-receipt dist/control-receipt
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/surface-system/shell/base.css
          test -f dist/system/index.html
          test -f dist/system-control.json
          test -f dist/status.json
          test -f dist/data/verifrax-system-control.json
          test -f dist/perimeter/index.html
          test -f dist/perimeter/status.json
          test -f dist/control-receipt/index.html
          test -f dist/control-receipt/receipt.json
          grep -Fx "status.verifrax.net" dist/CNAME
          grep -q "SYSTEM_CONTROL_MAP_OPEN" dist/system-control.json
          grep -q "SYSTEM_CONTROL_MAP_OPEN" dist/status.json
          grep -q "SYSTEM_CONTROL_MAP_OPEN" dist/system/index.html
          grep -q "PUBLIC_PERIMETER_GREEN" dist/perimeter/status.json
          grep -q "VERIFRAX_PUBLIC_CONTROL_RECEIPT_GREEN" dist/control-receipt/receipt.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
